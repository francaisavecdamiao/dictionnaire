<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F7F9FA">
<title>GALOLINGO — Dictionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="page">
  <div id="topbar">
    <div class="topbar-row">
      <h1 class="level-label" style="font-family: 'Feather Bold', 'Nunito', sans-serif; font-size: 20px; color: var(--laranja-escuro); margin: 0;">galolingo dictionnaire</h1>
      <span class="score-badge" onclick="renderHome()">🏠 Início</span>
    </div>
    <input type="text" id="search-input" placeholder="Buscar palavra ou verbo..." autocomplete="off">
  </div>

  <div id="reader">
    <!-- As páginas (dicionário ou conjugação) entram aqui -->
    <main id="book"></main>
    <!-- As letras serão injetadas aqui pelo JS -->
    <nav id="alphabet-index"></nav>
  </div>

  <footer id="pager">
    <button class="pager-btn" id="prev-btn" onclick="prevPage()" aria-label="Página anterior">◀</button>
    <span id="page-label">1 / 1</span>
    <button class="pager-btn" id="next-btn" onclick="nextPage()" aria-label="Próxima página">▶</button>
  </footer>
</div>

<script src="vocabulario.js"></script>
<script src="app.js"></script>
</body>
</html>
